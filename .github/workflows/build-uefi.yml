name: build-uefi

# 构建 HakiOS 的 UEFI（Mu-Silicium + HakiOS 补丁 + 设备平台），产出 SILICIUM_UEFI.fd
on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备名（devices/<name>）'
        required: true
        default: 'mayfly'
      device_repo:
        description: '设备仓 URL'
        required: true
        default: 'https://github.com/cotunjr/hakios-mayfly.git'
      mode:
        description: 'DEBUG 或 RELEASE'
        required: true
        default: 'DEBUG'

jobs:
  uefi:
    runs-on: ubuntu-latest
    env:
      DEVICE: ${{ inputs.device }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: checkout 内核仓
        uses: actions/checkout@v4

      - name: 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential uuid-dev iasl nasm python3 python3-pip git curl
          pip install --quiet edk2-pytool-extensions edk2-pytool-library

      - name: 取 HakiOS UEFI 工程与设备仓
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/oosexgang/hakios-uefi.git uefi
          mkdir -p devices
          git clone --depth 1 "${{ inputs.device_repo }}" "devices/$DEVICE"
          echo "BASE = $(cat uefi/BASE)"

      - name: 取 Mu-Silicium 基线并打补丁
        run: |
          set -euo pipefail
          BASE=$(cat uefi/BASE)
          ROOT=$PWD
          git clone --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium
          cd Mu-Silicium
          git fetch --depth 1 origin "$BASE"
          git checkout -q "$BASE"
          git submodule update --init --recursive --depth 1

          echo "--- HakiOS 补丁（主树）---"
          git apply --whitespace=nowarn "$ROOT/uefi/hakios.patch"
          cp -r "$ROOT/uefi/files/." .

          echo "--- 设备平台 ---"
          cp -r "$ROOT/devices/$DEVICE/uefi/files/." .

          echo "--- 设备补丁 ---"
          for p in "$ROOT/devices/$DEVICE/uefi/patches/"*-worktree.diff; do
            [ -f "$p" ] || continue
            name=$(basename "$p")
            case "$name" in
              *basecore*)
                # 这个补丁属于 basecore 子模块（UefiCpuPkg 等）
                bc=$(find . -maxdepth 3 -type d -name UefiCpuPkg | head -1)
                if [ -n "$bc" ]; then
                  sub=$(dirname "$bc")
                  echo "  $name -> $sub"
                  ( cd "$sub" && git apply --whitespace=nowarn "$p" ) || echo "  (跳过 $name)"
                else
                  echo "  找不到 basecore 子模块，跳过 $name"
                fi
                ;;
              *)
                echo "  $name -> 主树"
                git apply --whitespace=nowarn "$p" || echo "  (跳过 $name)"
                ;;
            esac
          done
          echo "--- 平台 ---"
          ls Platforms/Xiaomi

      - name: 构建 UEFI
        run: |
          set -euo pipefail
          cd Mu-Silicium
          CFG="Platforms/Xiaomi/${DEVICE}Pkg/DeviceBuild.py"
          ls "$CFG" || { echo "没有 $CFG"; exit 1; }
          echo "--- stuart_build 帮助（便于确认参数）---"
          stuart_build --help 2>&1 | head -20 || true
          echo "--- 构建 ---"
          stuart_build -c "$CFG" --toolchain CLANGPDB --target "$MODE" 2>&1 | tail -80
          echo "--- 产物 ---"
          find . -name '*.fd' | head -10

      - name: 上传 FD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-fd-${{ inputs.device }}
          path: |
            Mu-Silicium/Build/**/*.fd
          if-no-files-found: warn
          retention-days: 7
