name: build-uefi

# 构建 HakiOS 的 UEFI（Mu-Silicium + HakiOS 补丁 + 设备平台），产出 SILICIUM_UEFI.fd
on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备名（devices/<name>）'
        required: true
        default: 'mayfly'
      mode:
        description: 'DEBUG 或 RELEASE'
        required: true
        default: 'DEBUG'

jobs:
  uefi:
    runs-on: ubuntu-latest
    env:
      DEVICE: ${{ inputs.device }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential uuid-dev iasl nasm python3 python3-pip git curl
          pip install --quiet edk2-pytool-extensions edk2-pytool-library

      - name: 取 Mu-Silicium 基线并打 HakiOS 补丁
        run: |
          set -euo pipefail
          BASE=$(cat uefi/BASE)
          echo "Mu-Silicium 基线: $BASE"
          git clone --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium
          cd Mu-Silicium
          git fetch --depth 1 origin "$BASE"
          git checkout -q "$BASE"
          git submodule update --init --recursive --depth 1
          echo "--- 应用 HakiOS 补丁 ---"
          git apply --whitespace=nowarn ../uefi/hakios.patch
          cp -r ../uefi/files/. .
          echo "--- 拷贝设备平台 $DEVICE ---"
          cp -r "../devices/$DEVICE/uefi/files/." .
          for p in "../devices/$DEVICE/uefi/patches/"*-worktree.diff; do
            [ -f "$p" ] || continue
            echo "应用设备补丁: $p"
            git apply --whitespace=nowarn "$p" || echo "  (跳过: $p)"
          done
          echo "--- 平台目录 ---"
          ls Platforms/Xiaomi || true

      - name: 构建 UEFI
        run: |
          set -euo pipefail
          cd Mu-Silicium
          CFG="Platforms/Xiaomi/${DEVICE}Pkg/${DEVICE}.dsc"
          ls "$CFG" || { echo "找不到 DSC: $CFG"; ls Platforms/Xiaomi; exit 1; }
          # edk2toolext 的 stuart 构建
          if command -v stuart_build >/dev/null 2>&1; then
            export PYTHONPATH="$PWD/BaseTools/Source/Python:${PYTHONPATH:-}"
            stuart_build -c "Platforms/Xiaomi/${DEVICE}Pkg/DeviceBuild.py" \
              --tool-chain-tag CLANGPDB --target "$MODE" || true
          fi
          echo "--- 找产物 ---"
          find . -name 'SILICIUM_UEFI.fd' -o -name '*.fd' | head -10

      - name: 上传 FD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-fd-${{ inputs.device }}
          path: |
            Mu-Silicium/Build/**/FV/*.fd
          if-no-files-found: warn
          retention-days: 7
