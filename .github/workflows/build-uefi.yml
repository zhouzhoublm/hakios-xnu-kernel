name: build-uefi

# 构建 HakiOS 的 UEFI（Mu-Silicium + HakiOS 补丁 + 设备平台），产出 SILICIUM_UEFI.fd
# 注：设备仓里的 *-worktree.diff 是"参考、未整理"的调试产物（见 devices/<dev>/uefi/patches/README.md），
#     不应用它们；blob-free 启动只需要 hakios.patch + uefi/files + 设备平台。
on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备名（devices/<name>）'
        required: true
        default: 'mayfly'
      device_repo:
        description: '设备仓 URL'
        required: true
        default: 'https://github.com/cotunjr/hakios-mayfly.git'
      target:
        description: 'DEBUG 或 RELEASE'
        required: true
        default: 'DEBUG'

jobs:
  uefi:
    runs-on: ubuntu-24.04
    env:
      DEVICE: ${{ inputs.device }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: checkout 内核仓
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential uuid-dev iasl nasm git curl mono-devel ca-certificates-mono \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet edk2-pytool-extensions edk2-pytool-library regex

      - name: 取 HakiOS UEFI 工程与设备仓
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/oosexgang/hakios-uefi.git uefi
          mkdir -p devices
          git clone --depth 1 "${{ inputs.device_repo }}" "devices/$DEVICE"
          echo "BASE = $(cat uefi/BASE)"

      - name: 取 Mu-Silicium 基线并打补丁
        run: |
          set -euo pipefail
          BASE=$(cat uefi/BASE)
          ROOT=$PWD
          git clone --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium
          cd Mu-Silicium
          git fetch --depth 1 origin "$BASE"
          git checkout -q "$BASE"
          git submodule update --init --recursive --depth 1

          echo "--- HakiOS 补丁 ---"
          git apply --whitespace=nowarn "$ROOT/uefi/hakios.patch"
          cp -r "$ROOT/uefi/files/." .

          echo "--- 设备平台 $DEVICE ---"
          cp -r "$ROOT/devices/$DEVICE/uefi/files/." .

          echo "--- 设备的 XnuLoader.h（PAYLOAD_BASE 覆盖） ---"
          if [ -f "$ROOT/devices/$DEVICE/uefi/patches/XnuLoader.h.$DEVICE" ]; then
            XH=$(find . -name 'XnuLoader.h' | head -1)
            if [ -n "$XH" ]; then
              echo "  覆盖 $XH"
              cp "$ROOT/devices/$DEVICE/uefi/patches/XnuLoader.h.$DEVICE" "$XH"
            fi
          fi

          echo "--- 为 FDF/DSC 引用的未分发厂商文件建空占位（blob-free 构建）---"
          grep -rho 'Binaries/[A-Za-z0-9_./-]*' --include='*.fdf' --include='*.inc' --include='*.dsc' . \
            | sort -u | while read -r q; do
              if [ ! -e "$q" ]; then
                mkdir -p "$(dirname "$q")"
                : > "$q"
                echo "  stub: $q"
              fi
            done

          echo "--- 平台目录与 FDF 行数 ---"
          ls Platforms/Xiaomi
          wc -l Platforms/Xiaomi/*/mayfly.fdf 2>/dev/null || true

      - name: 读取设备的 FD 参数（FD_BASE / FD_SIZE / FD_BLOCKS）
        id: fd
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, pathlib
          dev = os.environ['DEVICE']
          t = pathlib.Path(f"devices/{dev}/uefi/files/Resources/Configs/{dev}.toml").read_text()
          base = re.search(r'base\s*=\s*(0x[0-9A-Fa-f]+)', t).group(1)
          size = re.search(r'size\s*=\s*(0x[0-9A-Fa-f]+)', t).group(1)
          print(f"base={base}")
          print(f"size={size}")
          print(f"blocks={int(size, 16)//0x1000}")
          PY

      - name: 构建 UEFI
        run: |
          set -euo pipefail
          cd Mu-Silicium
          CFG="Platforms/Xiaomi/${DEVICE}Pkg/DeviceBuild.py"
          ls "$CFG"
          echo "--- stuart_update（外部依赖：mu_nasm / Mu-Basetools / onecrypto-bin）---"
          stuart_update -c "$CFG" 2>&1 | tail -40
          echo "--- stuart_build ---"
          stuart_build -c "$CFG" \
            FD_BASE=${{ steps.fd.outputs.base }} \
            FD_SIZE=${{ steps.fd.outputs.size }} \
            FD_BLOCKS=${{ steps.fd.outputs.blocks }} \
            BLD_*_TARGET=$TARGET 2>&1 | tail -100
          echo "--- 产物 ---"
          find . -name '*.fd' | head -10

      - name: 打包可上机镜像（BootShim + FD + payload）
        continue-on-error: true
        run: |
          set -uo pipefail
          ROOT=$PWD
          FD=$(find Mu-Silicium/Build -name 'SILICIUM_UEFI.fd' | head -1)
          echo "FD: $FD ($(stat -c%s "$FD" 2>/dev/null || echo 0) 字节)"
          FD_BASE=${{ steps.fd.outputs.base }}
          FD_SIZE=${{ steps.fd.outputs.size }}
          DSCR="devices/$DEVICE/uefi/files/Platforms/Xiaomi/${DEVICE}Pkg/${DEVICE}.dsc"
          PAYLOAD_BASE=$(grep -oE 'XNU_PAYLOAD_BASE=0x[0-9A-Fa-f]+' "$DSCR" | head -1 | cut -d= -f2)
          echo "FD_BASE=$FD_BASE FD_SIZE=$FD_SIZE PAYLOAD_BASE=$PAYLOAD_BASE"

          echo "--- BootShim Makefile 前 25 行（诊断用）---"
          head -25 Mu-Silicium/BootShim/Makefile || true

          echo "--- 尝试 1：aarch64-linux-gnu-gcc ---"
          ( cd Mu-Silicium/BootShim && make clean >/dev/null 2>&1 || true
            make CC=aarch64-linux-gnu-gcc OBJCOPY=aarch64-linux-gnu-objcopy \
                 REQUIRES_KERNEL_HEADER=1 FD_BASE=$FD_BASE FD_SIZE=$FD_SIZE \
                 CFLAGS="-DPAYLOAD_BASE=$PAYLOAD_BASE" 2>&1 | tail -12 ) || true

          if [ ! -f Mu-Silicium/BootShim/BootShim.bin ]; then
            echo "--- 尝试 2：clang --target ---"
            ( cd Mu-Silicium/BootShim && make clean >/dev/null 2>&1 || true
              make CC=clang LD=ld.lld OBJCOPY=llvm-objcopy \
                   REQUIRES_KERNEL_HEADER=1 FD_BASE=$FD_BASE FD_SIZE=$FD_SIZE \
                   CFLAGS="--target=aarch64-linux-gnu -DPAYLOAD_BASE=$PAYLOAD_BASE" 2>&1 | tail -12 ) || true
          fi

          ls -l Mu-Silicium/BootShim/BootShim.bin 2>/dev/null || { echo "BootShim 未产出，停止打包"; exit 0; }

          echo "--- 打 XNUP payload ---"
          mkdir -p out
          python3 xnuloader/mkpayload.py --usb -o out/payload.bin \
            loader.efi=prebuilt/loader.efi kernel=prebuilt/hakios-kernel 2>&1 | tail -5
          ls -l out/payload.bin

          echo "--- shim + fd + payload ---"
          python3 - "$FD" <<'PY2'
          import sys, pathlib
          fd = pathlib.Path(sys.argv[1])
          blob = pathlib.Path('Mu-Silicium/BootShim/BootShim.bin').read_bytes() + fd.read_bytes() + pathlib.Path('out/payload.bin').read_bytes()
          pathlib.Path('out/kernel.raw').write_bytes(blob)
          print('  kernel.raw', len(blob))
          PY2
          gzip -9 -c out/kernel.raw > out/kernel.gz
          ls -l out/kernel.gz

          echo "--- mkbootimg 用法 ---"
          python3 Mu-Silicium/Resources/Scripts/mkbootimg.py --help 2>&1 | head -15 || true
          DTB="devices/$DEVICE/uefi/files/Resources/DTBs/$DEVICE.dtb"
          echo "DTB: $DTB ($(stat -c%s "$DTB" 2>/dev/null || echo 0) 字节)"
          python3 Mu-Silicium/Resources/Scripts/mkbootimg.py \
            --kernel out/kernel.gz --dtb "$DTB" --header_version 4 --pagesize 4096 \
            -o "xnu-$DEVICE.img" 2>&1 | tail -10 || true
          ls -l xnu-*.img 2>/dev/null || echo "  镜像未生成（看上面的 mkbootimg 报错）"

      - name: 上传 FD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-fd-${{ inputs.device }}
          path: |
            Mu-Silicium/Build/**/*.fd
            xnu-*.img
          if-no-files-found: warn
          retention-days: 7
