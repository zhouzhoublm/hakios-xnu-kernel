name: build-uefi

# 构建 HakiOS 的 UEFI（Mu-Silicium + HakiOS 补丁 + 设备平台），产出 SILICIUM_UEFI.fd
on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备名（devices/<name>）'
        required: true
        default: 'mayfly'
      device_repo:
        description: '设备仓 URL'
        required: true
        default: 'https://github.com/cotunjr/hakios-mayfly.git'
      mode:
        description: 'DEBUG 或 RELEASE'
        required: true
        default: 'DEBUG'

jobs:
  uefi:
    runs-on: ubuntu-latest
    env:
      DEVICE: ${{ inputs.device }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: checkout 内核仓
        uses: actions/checkout@v4

      - name: 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential uuid-dev iasl nasm python3 python3-pip git curl
          pip install --quiet edk2-pytool-extensions edk2-pytool-library

      - name: 取 HakiOS UEFI 工程与设备仓（两者都不在内核仓里）
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/oosexgang/hakios-uefi.git uefi
          mkdir -p devices
          git clone --depth 1 "${{ inputs.device_repo }}" "devices/$DEVICE"
          echo "BASE = $(cat uefi/BASE)"
          ls "devices/$DEVICE/uefi" || true

      - name: 取 Mu-Silicium 基线并打补丁
        run: |
          set -euo pipefail
          BASE=$(cat uefi/BASE)
          echo "Mu-Silicium 基线: $BASE"
          git clone --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium
          cd Mu-Silicium
          git fetch --depth 1 origin "$BASE"
          git checkout -q "$BASE"
          git submodule update --init --recursive --depth 1
          echo "--- HakiOS 补丁 ---"
          git apply --whitespace=nowarn ../uefi/hakios.patch
          cp -r ../uefi/files/. .
          echo "--- 设备平台 $DEVICE ---"
          cp -r "../devices/$DEVICE/uefi/files/." .
          shopt -s nullglob
          for p in "../devices/$DEVICE/uefi/patches/"*-worktree.diff; do
            echo "设备补丁: $p"
            git apply --whitespace=nowarn "$p" || echo "  (跳过 $p)"
          done
          echo "--- 平台 ---"
          ls Platforms/Xiaomi || true

      - name: 构建 UEFI
        run: |
          set -euo pipefail
          cd Mu-Silicium
          DEV=${DEVICE}Pkg
          CFG="Platforms/Xiaomi/$DEV/DeviceBuild.py"
          ls "Platforms/Xiaomi/$DEV" || { echo "没有 $DEV"; ls Platforms/Xiaomi; exit 1; }
          echo "--- stuart build ---"
          stuart_build -c "$CFG" --tool-chain-tag CLANGPDB --target "$MODE" 2>&1 | tail -60 || true
          echo "--- 产物 ---"
          find . -name '*.fd' | head -10

      - name: 上传 FD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-fd-${{ inputs.device }}
          path: |
            Mu-Silicium/Build/**/FV/*.fd
            Mu-Silicium/Build/**/*.fd
          if-no-files-found: warn
          retention-days: 7
